apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: disputeops-ingress
  namespace: meridian-disputes
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: disputes.meridian.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dispute-agent
                port:
                  number: 8080
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: core-ledger
                port:
                  number: 8081
